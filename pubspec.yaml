name: crow_pict_manege
description: "画像・動画のメタ情報を一覧・閲覧・編集するアプリケーション。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # 日本語・英語の UI（SPEC NFR-7）。Material/Cupertino の既定文言もこれで訳される。
  flutter_localizations:
    sdk: flutter

  # メタ情報の読み書きエンジン。pure Dart なので全プラットフォームで同一挙動になる。
  crowexif:
    path: ../crowexif

  # 非同期・派生状態の依存関係を明示するため。
  flutter_riverpod: ^3.0.0
  # フォルダ選択（デスクトップのネイティブダイアログ）。
  file_selector: ^1.0.3
  # 撮影日時などのロケール依存表示。
  intl: ^0.20.2
  path: ^1.9.0

  # 設定・キャッシュの保存先（OS ごとのアプリ領域）。
  path_provider: ^2.1.6
  # ウィンドウへのフォルダのドロップを受け取る（FR-B16）。
  desktop_drop: ^0.8.2
  # アプリの外へのドラッグ（FR-T4）。
  super_drag_and_drop: ^0.10.0-dev.2
  # 知覚ハッシュのための縮小・グレースケール化（FR-Q4）。pure Dart なので Isolate で回せる。
  image: ^4.9.2
  # 内容ハッシュ（SPEC §4.1、FR-B9）。pure Dart。
  crypto: ^3.0.7
  # カタログ（設定・ブックマーク・履歴・キャッシュ）。SQLite を全プラットフォームで共有する。
  drift: ^2.34.3
  # 地図表示。OSM のラスタタイルを使う（SPEC FR-M7）。
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  # 近いマーカーの集約（SPEC FR-M1）。pure Dart。
  supercluster: ^3.2.0
  # 動画の代表フレーム取得と再生（SPEC FR-B5〜FR-B7）。
  # 再生とフレーム取得を全プラットフォームで 1 実装に寄せられる（SPEC §7.2）。
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  # OS の共有機能への引き渡し（SPEC FR-T5）。各 OS の共有シートを 1 実装で賄う。
  share_plus: ^13.3.0
  # 地名の検索と逆引き（SPEC FR-M5、FR-M8）。既定では使わない。
  http: ^1.6.0
  # ブラウザの API（File System Access、SPEC §4.5）。Web だけで使う。
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # drift のテーブル定義からアクセサを生成する。
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  # lib/l10n/*.arb から AppLocalizations を生成する（l10n.yaml）。
  generate: true
